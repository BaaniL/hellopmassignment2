<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindMyDesk — Find a Workable Spot</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] },
        colors: { ink: '#0F172A', slate2: '#475569' }
      }
    }
  };
</script>
<style>
  .brand-grad { background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%); }
  .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
  .map-grid { background-color:#F5F3FF; background-image: linear-gradient(#E9E5FB 1px, transparent 1px), linear-gradient(90deg, #E9E5FB 1px, transparent 1px); background-size: 40px 40px; }
  @keyframes wv { 0%,100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }
  .wv { animation: wv .9s ease-in-out infinite; transform-origin: center; }
  @keyframes pulseG { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.45); } 100% { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }
  .live { animation: pulseG 1.4s ease-out infinite; }
  @keyframes pulseP { 0% { box-shadow: 0 0 0 0 rgba(124,58,237,.45); } 100% { box-shadow: 0 0 0 18px rgba(124,58,237,0); } }
  .recring { animation: pulseP 1.2s ease-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .3s ease both; }
  @keyframes flash { 0% { background:#F0FDF4; } 100% { background:#FFFFFF; } }
  .flash { animation: flash 1.6s ease; }
  :focus-visible { outline: 2px solid #7C3AED; outline-offset: 2px; }
</style>
</head>
<body class="bg-[#F8FAFC] font-sans text-ink antialiased">

<!-- Header -->
<header class="bg-white border-b border-slate-100 sticky top-0 z-30">
  <div class="max-w-[1360px] mx-auto px-4 md:px-8 pt-4 md:pt-5 pb-3 md:pb-4 flex flex-col gap-3 md:gap-4">
    <div class="flex items-center gap-4 md:gap-6">
      <a href="#" class="flex items-center gap-2.5 shrink-0">
        <span class="w-9 h-9 rounded-xl brand-grad text-white flex items-center justify-center"><i data-lucide="map-pin" class="w-5 h-5"></i></span>
        <span class="text-lg md:text-[19px] font-extrabold tracking-tight">FindMyDesk</span>
      </a>
      <label class="hidden md:flex flex-1 items-center gap-2.5 h-11 px-4 rounded-2xl bg-[#F8FAFC] border border-slate-200 text-slate-500 focus-within:border-violet-400 transition">
        <i data-lucide="search" class="w-[18px] h-[18px]"></i>
        <span class="sr-only">Search venues by name</span>
        <input id="searchDesktop" type="search" placeholder="Search cafés, libraries, lounges…" class="flex-1 bg-transparent outline-none text-[15px] text-ink placeholder:text-slate-400">
      </label>
      <span class="ml-auto md:ml-0 flex items-center gap-1.5 text-sm text-slate2 font-medium"><i data-lucide="navigation" class="w-4 h-4"></i>Near you</span>
      <button aria-label="Profile" class="hidden md:flex w-10 h-10 rounded-full border border-violet-100 bg-violet-50 text-violet-700 items-center justify-center hover:bg-violet-100 transition"><i data-lucide="user" class="w-[18px] h-[18px]"></i></button>
    </div>
    <label class="md:hidden flex items-center gap-2.5 h-11 px-3.5 rounded-2xl bg-[#F8FAFC] border border-slate-200 text-slate-500">
      <i data-lucide="search" class="w-[17px] h-[17px]"></i>
      <span class="sr-only">Search venues by name</span>
      <input id="searchMobile" type="search" placeholder="Search spots by name" class="flex-1 bg-transparent outline-none text-[15px] text-ink placeholder:text-slate-400">
    </label>
    <div id="pills" role="group" aria-label="Quick filters" class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 md:mx-0 md:px-0 md:flex-wrap"></div>
  </div>
</header>

<!-- Main -->
<main class="max-w-[1360px] mx-auto px-4 md:px-8 pt-4 md:pt-7 pb-32 md:pb-28 md:flex md:gap-7 md:items-start">
  <section aria-label="Venues" class="md:w-[420px] lg:w-[460px] md:shrink-0 flex flex-col gap-3.5">
    <div class="flex items-baseline justify-between">
      <h2 id="countLabel" class="text-[15px] font-bold"></h2>
      <span id="sortLabel" class="text-xs text-slate-500 font-medium"></span>
    </div>
    <div id="list" class="flex flex-col gap-3.5"></div>
  </section>
  <section id="scorecardDesktop" aria-label="Workability scorecard" class="hidden md:flex flex-1 min-w-0 flex-col gap-4 md:sticky md:top-[170px]"></section>
</main>

<!-- Desktop FAB -->
<button id="fabDesktop" class="hidden md:inline-flex fixed right-8 bottom-8 z-20 h-14 pl-4 pr-6 rounded-full brand-grad text-white font-bold text-[15px] items-center gap-2.5 shadow-[0_12px_28px_-10px_rgba(91,33,182,.6)] hover:-translate-y-0.5 transition">
  <span class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i data-lucide="mic" class="w-[18px] h-[18px]"></i></span>
  5-Sec Voice Check-In
</button>

<!-- Mobile bottom nav -->
<nav aria-label="Primary" class="md:hidden fixed inset-x-0 bottom-0 z-30 bg-white border-t border-slate-100 grid grid-cols-5 items-start pt-2 pb-[max(env(safe-area-inset-bottom),10px)]">
  <button data-tab="search" class="tabbtn h-12 flex flex-col items-center justify-center gap-1 text-[11px] font-semibold"><i data-lucide="search" class="w-[22px] h-[22px]"></i>Search</button>
  <button data-tab="favs" class="tabbtn h-12 flex flex-col items-center justify-center gap-1 text-[11px] font-semibold"><i data-lucide="heart" class="w-[22px] h-[22px]"></i>Favorites</button>
  <div class="flex justify-center">
    <button id="fabMobile" aria-label="5-Sec Voice Check-In" class="-mt-8 w-16 h-16 rounded-full border-4 border-white brand-grad text-white flex items-center justify-center shadow-[0_12px_24px_-8px_rgba(91,33,182,.6)]"><i data-lucide="mic" class="w-6 h-6"></i></button>
  </div>
  <button data-tab="map" class="tabbtn h-12 flex flex-col items-center justify-center gap-1 text-[11px] font-semibold"><i data-lucide="map" class="w-[22px] h-[22px]"></i>Nearby</button>
  <button data-tab="profile" class="tabbtn h-12 flex flex-col items-center justify-center gap-1 text-[11px] font-semibold"><i data-lucide="user" class="w-[22px] h-[22px]"></i>Profile</button>
</nav>

<!-- Mobile scorecard sheet -->
<div id="sheet" class="md:hidden fixed inset-0 z-40 hidden">
  <div data-close-sheet class="absolute inset-0 bg-slate-900/40"></div>
  <div role="dialog" aria-modal="true" aria-label="Workability scorecard" class="rise absolute inset-x-0 bottom-0 max-h-[90vh] overflow-y-auto bg-[#F8FAFC] rounded-t-3xl px-4 pt-2.5 pb-8">
    <div class="mx-auto w-10 h-1 rounded bg-slate-300 mb-3"></div>
    <div id="scorecardMobile" class="flex flex-col gap-3"></div>
    <button data-close-sheet class="w-full h-11 mt-2 text-slate2 font-semibold text-sm">Close</button>
  </div>
</div>

<!-- Voice modal -->
<div id="modal" class="fixed inset-0 z-50 hidden">
  <div data-close-modal class="absolute inset-0 bg-slate-900/50"></div>
  <div class="absolute inset-0 flex items-end md:items-center justify-center md:p-5 pointer-events-none">
    <div role="dialog" aria-modal="true" aria-labelledby="vcTitle" class="rise pointer-events-auto w-full md:max-w-[480px] bg-white rounded-t-3xl md:rounded-3xl p-5 md:p-7 flex flex-col gap-5 shadow-2xl">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-xs font-bold text-violet-700 tracking-wider uppercase">Checking in at</p>
          <h2 id="vcTitle" class="text-xl font-extrabold tracking-tight mt-0.5"></h2>
        </div>
        <button data-close-modal aria-label="Close" class="w-10 h-10 rounded-xl border border-slate-200 text-slate2 flex items-center justify-center hover:bg-slate-50"><i data-lucide="x" class="w-[18px] h-[18px]"></i></button>
      </div>
      <div id="modalBody" aria-live="polite"></div>
      <div id="modalActions" class="flex gap-2.5"></div>
    </div>
  </div>
</div>

<script>
/* ---------- Data (mandatory schema + numeric meta for filtering) ---------- */
const VENUES = [
  { id:'foundry', name:'The Coffee Foundry', distance:'0.4 miles away', kind:'Café', workabilityScore:9.4, mbps:120, outletPct:85, db:42, noiseWord:'Quiet / Call-Friendly', spendRule:'1 Coffee = 2.5 Hrs Worry-Free Work', spendShort:'1 coffee = 2.5 hrs', spendHours:2.5, minSpend:4, lastUpdated:'Updated 10 mins ago', tags:['Wall desks','Natural light','Bookable booths'], x:46, y:36 },
  { id:'cobalt', name:'Cobalt Cowork Lounge', distance:'1.9 miles away', kind:'Lounge', workabilityScore:9.6, mbps:300, outletPct:95, db:45, noiseWord:'Quiet / Call-Friendly', spendRule:'Day Pass = All-Day Access', spendShort:'Day pass = all day', spendHours:8, minSpend:12, lastUpdated:'Updated 5 mins ago', tags:['Phone booths','Monitors','Ergonomic chairs'], x:80, y:22 },
  { id:'ledger', name:'Ledger Library Café', distance:'1.1 miles away', kind:'Library café', workabilityScore:9.1, mbps:180, outletPct:60, db:38, noiseWord:'Silent Zone', spendRule:'No Minimum · Stay Till Close', spendShort:'No minimum', spendHours:6, minSpend:0, lastUpdated:'Updated 1 hr ago', tags:['Silent floor','Long tables'], x:20, y:30 },
  { id:'paper', name:'Paper & Pour', distance:'0.7 miles away', kind:'Café', workabilityScore:8.7, mbps:95, outletPct:70, db:48, noiseWord:'Calm', spendRule:'1 Drink = 2 Hrs Worry-Free Work', spendShort:'1 drink = 2 hrs', spendHours:2, minSpend:5, lastUpdated:'Updated 25 mins ago', tags:['Bar seating','Window counter'], x:58, y:70 },
  { id:'north', name:'Northside Roasters', distance:'1.4 miles away', kind:'Roastery', workabilityScore:7.6, mbps:140, outletPct:40, db:62, noiseWord:'Lively', spendRule:'1 Coffee = 1 Hr · Laptop-Free Weekends', spendShort:'1 coffee = 1 hr', spendHours:1, minSpend:4, lastUpdated:'Updated 3 hrs ago', tags:['Communal table','Patio'], x:30, y:82 },
  { id:'bean', name:'Bean Theory', distance:'2.3 miles away', kind:'Bistro café', workabilityScore:6.8, mbps:45, outletPct:30, db:68, noiseWord:'Busy at Lunch', spendRule:'1 Meal = 3 Hrs', spendShort:'1 meal = 3 hrs', spendHours:3, minSpend:14, lastUpdated:'Updated 6 hrs ago', tags:['Big tables','Late hours'], x:88, y:76 },
].map(syncStrings);

function syncStrings(v) {
  v.wifiSpeed = `⚡ ${v.mbps} Mbps`;
  v.outletDensity = `🔌 ${v.outletPct}% Outlets Open`;
  v.noiseLevel = `🎧 ${v.db} dB · ${v.noiseWord}`;
  return v;
}

const FILTERS = [
  { id:'all', label:'All Spots', sort:'Sorted by workability' },
  { id:'wifi', label:'Fastest Wi-Fi (>100 Mbps)', sort:'Fastest first' },
  { id:'outlets', label:'Most Power Outlets', sort:'Most outlets first' },
  { id:'quiet', label:'Quiet / Call-Friendly', sort:'Quietest first' },
  { id:'spend', label:'Low Minimum Spend', sort:'Lowest spend first' },
];
const PARSED_TAGS = ['Quiet Noise (42dB)', 'Power Outlets Available at Wall Desks', 'Fast 120 Mbps Wi-Fi'];

/* ---------- State ---------- */
const state = { venues: VENUES, query:'', filter:'all', tab:'search', selectedId:'foundry', favs:new Set(), checkins:0, stage:'idle', secs:5, timers:[] };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected = () => state.venues.find(v => v.id === state.selectedId) || state.venues[0];
const clamp = (n) => Math.max(0, Math.min(10, n));
const r1 = (n) => Math.round(n * 10) / 10;
const subs = (v) => ({ wifi:r1(clamp(v.mbps/15)), outlet:r1(clamp(v.outletPct/10)), noise:r1(clamp((72-v.db)/3.4)), spend:r1(clamp(v.spendHours/0.6)) });
const isDesktop = () => window.matchMedia('(min-width: 768px)').matches;

function filtered() {
  const q = state.query.trim().toLowerCase();
  let list = state.venues.filter(v => !q || v.name.toLowerCase().includes(q));
  if (state.tab === 'favs' && !isDesktop()) list = list.filter(v => state.favs.has(v.id));
  switch (state.filter) {
    case 'wifi': return list.filter(v => v.mbps > 100).sort((a,b) => b.mbps - a.mbps);
    case 'outlets': return list.filter(v => v.outletPct >= 70).sort((a,b) => b.outletPct - a.outletPct);
    case 'quiet': return list.filter(v => v.db <= 48).sort((a,b) => a.db - b.db);
    case 'spend': return list.filter(v => v.minSpend <= 5).sort((a,b) => a.minSpend - b.minSpend);
    default: return list.slice().sort((a,b) => b.workabilityScore - a.workabilityScore);
  }
}

/* ---------- Render ---------- */
function renderPills() {
  $('#pills').innerHTML = FILTERS.map(f => {
    const on = state.filter === f.id;
    return `<button data-filter="${f.id}" aria-pressed="${on}" class="shrink-0 h-9 px-4 rounded-full border text-[13.5px] font-semibold whitespace-nowrap transition ${on ? 'brand-grad text-white border-transparent shadow-sm' : 'bg-white text-slate2 border-slate-200 hover:border-violet-300 hover:text-violet-700'}">${f.label}</button>`;
  }).join('');
}

function chip(icon, text) {
  return `<span class="inline-flex items-center gap-1.5 h-7 px-2.5 rounded-lg bg-violet-50 text-violet-800 text-[12.5px] font-semibold"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${esc(text)}</span>`;
}

function renderList() {
  const list = filtered();
  const f = FILTERS.find(x => x.id === state.filter);
  const heading = state.tab === 'favs' && !isDesktop() ? 'Your saved spots' : (state.tab === 'profile' && !isDesktop() ? 'Profile' : '');
  $('#countLabel').textContent = heading || `${list.length} ${list.length === 1 ? 'spot' : 'spots'} nearby`;
  $('#sortLabel').textContent = f.sort;

  if (state.tab === 'profile' && !isDesktop()) {
    $('#list').innerHTML = `
      <div class="bg-white border border-violet-100 rounded-2xl p-5 flex flex-col gap-4 shadow-sm">
        <div class="flex items-center gap-3">
          <span class="w-12 h-12 rounded-full bg-violet-50 text-violet-700 flex items-center justify-center"><i data-lucide="user" class="w-6 h-6"></i></span>
          <div><p class="font-bold">[Your name]</p><p class="text-sm text-slate2">Community contributor</p></div>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div class="bg-[#F8FAFC] rounded-xl p-3"><p class="font-mono text-2xl font-semibold">${state.checkins}</p><p class="text-xs text-slate2 font-semibold">Check-ins this session</p></div>
          <div class="bg-[#F8FAFC] rounded-xl p-3"><p class="font-mono text-2xl font-semibold">${state.favs.size}</p><p class="text-xs text-slate2 font-semibold">Saved spots</p></div>
        </div>
      </div>`;
    lucide.createIcons();
    return;
  }

  if (!list.length) {
    $('#list').innerHTML = `<div class="py-10 px-6 rounded-2xl border border-dashed border-violet-200 bg-white text-center text-sm text-slate2">
      <p class="font-bold text-ink mb-1">${state.tab === 'favs' && !isDesktop() ? 'No saved spots yet' : 'No spots match'}</p>
      <p>${state.tab === 'favs' && !isDesktop() ? 'Open a scorecard and tap Save.' : 'Try a different name or clear the filter.'}</p></div>`;
    return;
  }

  $('#list').innerHTML = list.map(v => {
    const on = v.id === state.selectedId && isDesktop();
    const hi = v.workabilityScore >= 9;
    return `
    <button data-venue="${v.id}" aria-pressed="${on}" class="group text-left w-full p-4 md:p-[18px] rounded-2xl bg-white border-[1.5px] flex flex-col gap-3.5 transition hover:-translate-y-0.5 ${on ? 'border-violet-600 shadow-[0_0_0_4px_rgba(124,58,237,.10),0_12px_28px_-16px_rgba(76,29,149,.45)]' : 'border-purple-100 shadow-sm hover:shadow-md'} ${v.fresh ? 'flash' : ''}">
      <div class="flex items-start gap-3.5 w-full">
        <div class="flex-1 min-w-0">
          <p class="text-base font-bold tracking-tight">${esc(v.name)}</p>
          <p class="text-[13px] text-slate2 mt-1">${esc(v.distance)} <span class="text-slate-300">•</span> ${esc(v.kind)}</p>
        </div>
        <div class="min-w-[58px] h-[52px] rounded-xl flex flex-col items-center justify-center ${hi ? 'brand-grad text-white' : 'bg-slate-100 text-ink'}">
          <span class="font-mono text-lg font-semibold leading-none">${v.workabilityScore.toFixed(1)}</span>
          <span class="text-[10px] font-semibold opacity-85 mt-0.5">/ 10</span>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5">
        ${chip('wifi', v.mbps + ' Mbps')}${chip('plug', v.outletPct + '% outlets')}${chip('headphones', v.db + ' dB')}
      </div>
      <div class="flex items-center justify-between gap-2.5 text-[12.5px] text-slate-500 w-full">
        <span class="inline-flex items-center gap-1.5"><i data-lucide="coffee" class="w-3.5 h-3.5"></i>${esc(v.spendShort)}</span>
        <span class="inline-flex items-center gap-1.5 ${v.fresh ? 'text-green-700 font-bold' : ''}">${v.fresh ? '<span class="live w-[7px] h-[7px] rounded-full bg-green-600"></span>' : ''}${esc(v.lastUpdated)}</span>
      </div>
    </button>`;
  }).join('');
  lucide.createIcons();
}

function metricTile(icon, label, value, sub, score, pct) {
  return `
  <div class="bg-white border border-purple-100 rounded-2xl p-4 md:p-[18px] flex flex-col gap-3 shadow-sm hover:shadow-md transition">
    <div class="flex items-center justify-between">
      <span class="w-9 h-9 rounded-xl bg-violet-50 text-violet-700 flex items-center justify-center"><i data-lucide="${icon}" class="w-[18px] h-[18px]"></i></span>
      <span class="font-mono text-xs text-slate-500">${score.toFixed(1)}/10</span>
    </div>
    <div>
      <p class="text-[12.5px] text-slate2 font-semibold">${label}</p>
      <p class="text-lg md:text-2xl font-extrabold tracking-tight mt-0.5 leading-tight">${esc(value)}</p>
      ${sub ? `<p class="text-[13px] text-slate2 mt-0.5">${esc(sub)}</p>` : ''}
    </div>
    <div class="h-1.5 rounded-full bg-violet-100 overflow-hidden"><div class="h-full rounded-full bg-violet-600 transition-all duration-700" style="width:${pct}%"></div></div>
  </div>`;
}

function scorecardHTML(v, withMap) {
  const s = subs(v);
  const fav = state.favs.has(v.id);
  const pins = state.venues.map(p => {
    const on = p.id === v.id;
    return `<button data-venue="${p.id}" aria-label="${esc(p.name)}, score ${p.workabilityScore.toFixed(1)}" class="absolute -translate-x-1/2 -translate-y-full flex flex-col items-center ${on ? 'z-10 text-violet-700' : 'text-violet-400 hover:text-violet-600'}" style="left:${p.x}%;top:${p.y}%">
      <span class="px-1.5 py-0.5 rounded-md font-mono text-[11px] font-semibold shadow ${on ? 'bg-violet-700 text-white' : 'bg-white text-violet-900'}">${p.workabilityScore.toFixed(1)}</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="#fff" stroke-width="1.5" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg>
    </button>`;
  }).join('');

  return `
  <div class="rounded-[20px] p-5 md:p-7 brand-grad text-white flex flex-wrap gap-5 md:gap-6 items-center shadow-[0_20px_40px_-24px_rgba(79,70,229,.7)]">
    <div class="flex-1 min-w-[200px] flex flex-col gap-2.5">
      <span class="self-start inline-flex items-center gap-1.5 h-6 px-2.5 rounded-full bg-white/15 text-xs font-semibold"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i>AI Workability Scorecard</span>
      <h1 class="text-2xl md:text-[30px] font-extrabold tracking-tight leading-tight">${esc(v.name)}</h1>
      <div class="flex flex-wrap items-center gap-x-3.5 gap-y-1.5 text-sm text-violet-100">
        <span class="inline-flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i>${esc(v.distance)}</span>
        <span class="inline-flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5"></i>${esc(v.lastUpdated)}</span>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-1">${v.tags.map(t => `<span class="h-6 px-2.5 inline-flex items-center rounded-lg bg-white/15 text-[12.5px] font-semibold">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="flex flex-col items-center gap-1.5">
      <div class="w-24 h-24 md:w-[132px] md:h-[132px] rounded-full bg-white/10 border border-white/30 flex flex-col items-center justify-center">
        <span class="font-mono text-3xl md:text-[42px] font-semibold leading-none">${v.workabilityScore.toFixed(1)}</span>
        <span class="text-xs md:text-[13px] font-semibold text-violet-200 mt-1">/ 10</span>
      </div>
      <span class="text-[11px] md:text-xs font-semibold text-violet-100 tracking-wider uppercase">Workability Index</span>
    </div>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 xl:grid-cols-2 2xl:grid-cols-4 gap-3 md:gap-3.5">
    ${metricTile('wifi', 'Wi-Fi Bandwidth', v.wifiSpeed.replace('⚡ ', ''), '', s.wifi, s.wifi*10)}
    ${metricTile('plug', 'Power Socket Density', v.outletDensity.replace('🔌 ', ''), '', s.outlet, s.outlet*10)}
    ${metricTile('headphones', 'Acoustic Noise Level', v.db + ' dB', v.noiseWord, s.noise, s.noise*10)}
    ${metricTile('coffee', 'Spend-to-Dwell Policy', v.spendRule, '', s.spend, s.spend*10)}
  </div>

  ${withMap ? `
  <div class="bg-white border border-purple-100 rounded-2xl overflow-hidden shadow-sm">
    <div class="relative h-60 map-grid">
      <div aria-hidden="true" class="absolute inset-x-0 top-[46%] h-3.5 bg-white border-y border-violet-100"></div>
      <div aria-hidden="true" class="absolute inset-y-0 left-[38%] w-3.5 bg-white border-x border-violet-100"></div>
      <div aria-hidden="true" class="absolute left-[66%] top-[12%] w-[18%] h-[26%] rounded-xl bg-green-100/70"></div>
      <div role="img" aria-label="You are here" class="absolute left-[41%] top-[52%] w-3.5 h-3.5 rounded-full bg-indigo-600 border-[3px] border-white shadow-[0_0_0_6px_rgba(79,70,229,.18)]"></div>
      ${pins}
    </div>` : `<div class="bg-white border border-purple-100 rounded-2xl overflow-hidden shadow-sm">`}
    <div class="flex flex-wrap items-center justify-between gap-3 p-4">
      <div class="${withMap ? '' : 'hidden'}"><p class="text-sm font-bold">${esc(v.name)}</p><p class="text-[13px] text-slate2">[Street address]</p></div>
      <div class="flex gap-2 ${withMap ? '' : 'w-full'}">
        <button data-fav aria-pressed="${fav}" class="h-11 px-4 rounded-xl border border-violet-200 text-violet-700 font-semibold text-sm inline-flex items-center gap-2 transition ${fav ? 'bg-violet-50' : 'bg-white hover:bg-violet-50'}">
          <i data-lucide="heart" class="w-4 h-4 ${fav ? 'fill-current' : ''}"></i>${fav ? 'Saved' : 'Save'}
        </button>
        ${withMap
          ? `<a href="#" class="h-11 px-4 rounded-xl bg-ink text-white font-semibold text-sm inline-flex items-center gap-2 hover:bg-slate-800 transition"><i data-lucide="navigation" class="w-4 h-4"></i>Directions</a>`
          : `<button data-open-modal class="flex-1 h-11 rounded-xl brand-grad text-white font-bold text-sm">Check in here</button>`}
      </div>
    </div>
  </div>`;
}

function renderScorecard() {
  const v = selected();
  $('#scorecardDesktop').innerHTML = scorecardHTML(v, true);
  $('#scorecardMobile').innerHTML = scorecardHTML(v, false);
  lucide.createIcons();
}

function renderTabs() {
  document.querySelectorAll('.tabbtn').forEach(b => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle('text-violet-700', on);
    b.classList.toggle('text-slate-500', !on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
}

function renderAll() { renderPills(); renderList(); renderScorecard(); renderTabs(); }

/* ---------- Voice check-in modal ---------- */
const BAR_H = [10,18,28,20,36,44,30,22,40,52,34,26,46,38,24,48,54,32,42,28,50,36,20,44,30,40,26,34,18,28,14,10];

function waveHTML(recording) {
  const bars = BAR_H.map((h, i) => `<span class="${recording ? 'wv' : ''} w-1 rounded" style="height:${recording ? h : Math.max(6, Math.round(h*.35))}px;background:${recording ? (i%3===0 ? '#4F46E5' : '#7C3AED') : '#C4B5FD'};animation-delay:${((i%8)*.09).toFixed(2)}s"></span>`).join('');
  return `
  <div class="rounded-[18px] bg-[#F8FAFC] border border-violet-100 px-4 py-6 flex flex-col items-center gap-4">
    <div class="${recording ? 'recring' : ''} w-16 h-16 rounded-full brand-grad text-white flex items-center justify-center"><i data-lucide="mic" class="w-7 h-7"></i></div>
    <div aria-hidden="true" class="h-14 flex items-center gap-1">${bars}</div>
    <p class="text-sm font-semibold text-slate2 text-center">${recording ? `Listening… 0:0${state.secs} left` : 'Say what you notice: Wi-Fi, outlets, noise, spend rules.'}</p>
  </div>`;
}

function renderModal() {
  const st = state.stage;
  $('#vcTitle').textContent = selected().name;
  let body = '', actions = '';
  if (st === 'idle' || st === 'recording') {
    body = waveHTML(st === 'recording');
    actions = st === 'idle'
      ? `<button id="btnStart" class="flex-1 h-13 py-3.5 rounded-2xl brand-grad text-white font-bold text-[15px] inline-flex items-center justify-center gap-2.5 hover:shadow-lg transition"><i data-lucide="mic" class="w-[18px] h-[18px]"></i>Simulate 5-Sec Voice Check-In</button>`
      : `<button id="btnStop" class="flex-1 py-3.5 rounded-2xl border border-violet-200 text-violet-700 font-bold text-[15px] hover:bg-violet-50">Stop &amp; transcribe now</button>`;
  } else if (st === 'processing') {
    body = `
    <div class="rounded-[18px] bg-violet-50 border border-violet-200 px-4 py-9 flex flex-col items-center gap-3.5">
      <span class="w-9 h-9 rounded-full border-[3px] border-violet-200 border-t-violet-600 animate-spin"></span>
      <p class="text-[15px] font-bold text-violet-900 text-center">AI Transcribing &amp; Structuring Voice Data...</p>
      <p class="text-[13px] text-slate2">Extracting Wi-Fi, power, noise and spend signals</p>
    </div>`;
  } else if (st === 'done') {
    body = `
    <div class="rise flex flex-col gap-3.5">
      <div class="rounded-2xl bg-[#F8FAFC] border border-slate-200 px-4 py-3.5 text-sm text-slate-700 leading-relaxed">
        <p class="text-[11px] font-bold text-slate-500 tracking-wider uppercase mb-1.5">Transcript</p>
        “Super quiet in here, the wall desks all have outlets, and the Wi-Fi’s pulling about 120 down.”
      </div>
      <div class="flex flex-col gap-2">
        <p class="text-[11px] font-bold text-slate-500 tracking-wider uppercase">Parsed Tags</p>
        <div class="flex flex-wrap gap-2">${PARSED_TAGS.map(t => `<span class="inline-flex items-center gap-1.5 min-h-8 px-3 py-1 rounded-xl bg-violet-50 border border-violet-200 text-violet-800 text-[13px] font-semibold"><i data-lucide="check" class="w-3.5 h-3.5"></i>${t}</span>`).join('')}</div>
        <code class="block font-mono text-[11.5px] text-slate2 bg-slate-50 rounded-xl px-3 py-2.5 leading-relaxed break-words">Parsed Tags: ${esc(JSON.stringify(PARSED_TAGS)).replace(/,/g, ', ')}</code>
      </div>
      <div class="flex items-center gap-2.5 px-3.5 py-3 rounded-xl bg-green-50 border border-green-200 text-green-800 text-[13.5px] font-semibold">
        <span class="live w-2 h-2 rounded-full bg-green-600 shrink-0"></span>Scorecard updated just now by Community
      </div>
    </div>`;
    actions = `
      <button id="btnAgain" class="flex-1 py-3.5 rounded-2xl border border-violet-200 text-violet-700 font-bold text-[14.5px] hover:bg-violet-50">Record again</button>
      <button id="btnView" class="flex-1 py-3.5 rounded-2xl brand-grad text-white font-bold text-[14.5px]">View scorecard</button>`;
  }
  $('#modalBody').innerHTML = body;
  $('#modalActions').innerHTML = actions;
  $('#modalActions').classList.toggle('hidden', !actions);
  lucide.createIcons();
}

function clearTimers() { state.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); state.timers = []; }

function openModal() {
  clearTimers();
  state.stage = 'idle'; state.secs = 5;
  $('#modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderModal();
}
function closeModal() {
  clearTimers();
  $('#modal').classList.add('hidden');
  if ($('#sheet').classList.contains('hidden')) document.body.style.overflow = '';
}
function startRecording() {
  clearTimers();
  state.stage = 'recording'; state.secs = 5; renderModal();
  state.timers.push(setInterval(() => {
    state.secs -= 1;
    if (state.secs <= 0) { clearTimers(); process(); } else renderModal();
  }, 1000));
}
function process() {
  state.stage = 'processing'; renderModal();
  state.timers.push(setTimeout(applyCheckIn, 1500));
}
function applyCheckIn() {
  const id = state.selectedId;
  state.venues = state.venues.map(v => {
    if (v.id !== id) return { ...v, fresh: false };
    const n = { ...v, mbps:120, outletPct:Math.max(85, v.outletPct), db:42, noiseWord:'Quiet / Call-Friendly' };
    syncStrings(n);
    const s = subs(n);
    const computed = r1(s.wifi*.3 + s.outlet*.3 + s.noise*.25 + s.spend*.15);
    n.workabilityScore = r1(Math.min(9.9, Math.max(v.workabilityScore + .1, computed)));
    n.lastUpdated = 'Updated just now by Community';
    n.fresh = true;
    n.tags = ['Wall desks', ...v.tags.filter(t => t !== 'Wall desks')].slice(0, 4);
    return n;
  });
  state.checkins += 1;
  state.stage = 'done';
  renderModal(); renderList(); renderScorecard();
}

/* ---------- Mobile sheet ---------- */
function openSheet() { $('#sheet').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#sheet').classList.add('hidden'); document.body.style.overflow = ''; }

/* ---------- Events ---------- */
function onSearch(e) {
  state.query = e.target.value;
  $('#searchDesktop').value = state.query; $('#searchMobile').value = state.query;
  renderList();
}
$('#searchDesktop').addEventListener('input', onSearch);
$('#searchMobile').addEventListener('input', onSearch);

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a, [data-close-sheet], [data-close-modal]');
  if (!t) return;
  if (t.dataset.filter) { state.filter = t.dataset.filter; if (state.tab === 'profile') state.tab = 'search'; renderPills(); renderList(); renderTabs(); return; }
  if (t.dataset.venue) {
    state.selectedId = t.dataset.venue;
    renderList(); renderScorecard();
    if (!isDesktop() && t.closest('#list')) openSheet();
    return;
  }
  if (t.dataset.tab) { state.tab = t.dataset.tab === 'map' ? 'search' : t.dataset.tab; window.scrollTo({ top:0, behavior:'smooth' }); renderTabs(); renderList(); return; }
  if (t.hasAttribute('data-fav')) { state.favs.has(state.selectedId) ? state.favs.delete(state.selectedId) : state.favs.add(state.selectedId); renderScorecard(); if (state.tab !== 'search') renderList(); return; }
  if (t.hasAttribute('data-close-sheet')) { closeSheet(); return; }
  if (t.hasAttribute('data-close-modal')) { closeModal(); return; }
  if (t.hasAttribute('data-open-modal') || t.id === 'fabDesktop' || t.id === 'fabMobile') { openModal(); return; }
  if (t.id === 'btnStart') { startRecording(); return; }
  if (t.id === 'btnStop') { clearTimers(); process(); return; }
  if (t.id === 'btnAgain') { clearTimers(); state.stage = 'idle'; renderModal(); return; }
  if (t.id === 'btnView') { closeModal(); if (!isDesktop()) openSheet(); return; }
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').classList.contains('hidden')) closeModal();
  else if (!$('#sheet').classList.contains('hidden')) closeSheet();
});

let lastDesk = isDesktop();
window.addEventListener('resize', () => { const d = isDesktop(); if (d !== lastDesk) { lastDesk = d; if (d) closeSheet(); renderList(); } });

renderAll();
</script>
</body>
</html>
