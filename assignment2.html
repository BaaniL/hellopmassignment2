<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindMyDesk — Find a Workable Spot</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] },
        colors: { ink: '#0F172A', slate2: '#475569' }
      }

  };
</script>
<style>
  .brand-grad { background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%); }
  .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
  .thin-scroll { scrollbar-width: thin; scrollbar-color: #DDD6FE transparent; scrollbar-gutter: stable; }
  .thin-scroll::-webkit-scrollbar { width: 14px; }
  .thin-scroll::-webkit-scrollbar-track { background: transparent; margin-block: 12px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: #DDD6FE; border-radius: 999px; border: 4px solid transparent; background-clip: padding-box; }
  .thin-scroll::-webkit-scrollbar-thumb:hover { background-color: #C4B5FD; }
  .map-bg { background-color:#EEF2F6; background-image: linear-gradient(#E3E8EF 1px, transparent 1px), linear-gradient(90deg, #E3E8EF 1px, transparent 1px); background-size: 32px 32px; }
  @keyframes wv { 0%,100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }
  .wv { animation: wv .9s ease-in-out infinite; transform-origin: center; }
  @keyframes pulseG { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.5); } 100% { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }
  .live { animation: pulseG 1.4s ease-out infinite; }
  @keyframes pulseP { 0% { box-shadow: 0 0 0 0 rgba(124,58,237,.45); } 100% { box-shadow: 0 0 0 18px rgba(124,58,237,0); } }
  .recring { animation: pulseP 1.2s ease-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .3s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade { animation: fadeIn .2s ease both; }
  @keyframes flash { 0% { background:#F0FDF4; } 100% { background:#FFFFFF; } }
  .flash { animation: flash 1.6s ease; }
  img { filter: brightness(1.06) contrast(1.05) saturate(1.15); }
  img.object-cover { object-fit: cover; width: 100%; height: 100%; }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
  .menu-in { animation: menuIn .18s cubic-bezier(.2,.8,.2,1) both; transform-origin: top right; }
  @keyframes slideIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .slide-in { animation: slideIn .28s ease both; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .toast-in { animation: toastIn .25s ease both; }
  :focus-visible { outline: 2px solid #7C3AED; outline-offset: 2px; }
</style>
</head>
<body class="bg-[#F8FAFC] font-sans text-ink antialiased">
<div id="app"></div>
<div id="lightboxRoot"></div>
<div id="toastRoot" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[80] pointer-events-none"></div>

<script>
/* =========================================================
   DATA — mandatory schema + numeric meta for filtering
   ========================================================= */
const UNSPLASH = (id, w = 900) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=80`;
const IMG_FALLBACK = "this.onerror=null;this.style.display='none';this.parentElement.classList.add('brand-grad')";

const GALLERY_LABELS = [
  { label:'Power outlet desks',   icon:'plug' },
  { label:'Quiet booth seating',  icon:'headphones' },
  { label:'Window seats',         icon:'sun' },
  { label:'Main coffee bar',      icon:'coffee' },
  { label:'Outdoor patio desks',  icon:'trees' },
  { label:'Meeting corner nook',  icon:'users' },
  { label:'Latte & pastry bar',   icon:'cup-soda' },
  { label:'Lounge seating',       icon:'sofa' },
];
/* Bright, high-res Unsplash pools — one pool per gallery angle (order matches GALLERY_LABELS) */
const GALLERY_POOLS = [
  ['1498050108023-c5249f4df085','1486312338219-ce68d2c6f44d','1453614512568-c4024d13c247'],
  ['1497366216548-37526070297c','1524758631624-e2822e304c36','1497215728101-856f4ea42174'],
  ['1513694203232-719a280e022f','1484101403633-562f891dc89a','1522708323590-d24dbb6b0267'],
  ['1554118811-1e0d58224f24','1501339847302-ac426a4a7cbb','1445116572660-236099ec97a0'],
  ['1517248135467-4c7edcad34c4','1559925393-8be0ec4767c8'],
  ['1556761175-5973dc0f32e7','1527192491265-7e15c55b1ed2','1519389950473-47ba0277781c'],
  ['1495474472287-4d71bcdd2085','1509042239860-f550ce710b93','1559496417-e7f25cb247f3'],
  ['1521017432531-fbd92d768814','1507842217343-583bb7270b66','1554118811-1e0d58224f24'],
];
const galleryFor = (idx) => GALLERY_POOLS.map((pool, k) => pool[(idx + k) % pool.length]);

/* Extra discovery attributes (daylight / pets / closing hour, 24h) */
const EXTRAS = {
  foundry: { daylight:true,  pets:false, closes:20, addTags:['Artisanal coffee'] },
  cobalt:  { daylight:true,  pets:true,  closes:23, addTags:['Pet friendly'] },
  ledger:  { daylight:true,  pets:false, closes:21, addTags:['Natural light'] },
  paper:   { daylight:true,  pets:true,  closes:19, addTags:['Artisanal coffee'] },
  north:   { daylight:false, pets:true,  closes:18, addTags:['Pet friendly'] },
  bean:    { daylight:false, pets:false, closes:24, addTags:[] },
};
const VENUES = [
  { id:'foundry', name:'The Coffee Foundry', distance:'0.4 km away', kind:'Café', workabilityScore:9.4, mbps:120, outletPct:85, db:42, noiseWord:'Quiet / Call-Friendly', spendRule:'₹150 Spend = 2.5 Hrs Worry-Free Work', spendShort:'₹150 = 2.5 hrs', spendHours:2.5, minSpend:150, lastUpdated:'Updated 10 mins ago', status:'Open now · Seats available', tags:['Wall desks','Natural light','Bookable booths'], x:46, y:38,
    photo:'1554118811-1e0d58224f24', reviews:[
      { name:'Priya S.', stars:5, time:'2 days ago', text:'Took three back-to-back Zoom calls from the wall desks and nobody batted an eye. Every seat along the wall has its own socket.', tags:['Great outlet access','Fast Wi-Fi for video calls','Call-friendly'] },
      { name:'Marcus T.', stars:4, time:'1 week ago', text:'Gets busier after 1 PM but the back room stays calm. Staff never rushed me, even after three hours.', tags:['Quiet back room','Relaxed stay policy'] } ] },
  { id:'cobalt', name:'Cobalt Cowork Lounge', distance:'1.9 km away', kind:'Lounge', workabilityScore:9.6, mbps:300, outletPct:95, db:45, noiseWord:'Quiet / Call-Friendly', spendRule:'₹450 Day Pass = All-Day Access', spendShort:'₹450 day pass = all day', spendHours:8, minSpend:450, lastUpdated:'Updated 5 mins ago', status:'Open now · Booths free', tags:['Phone booths','Monitors','Ergonomic chairs'], x:80, y:24,
    photo:'1497366216548-37526070297c', reviews:[
      { name:'Aisha K.', stars:5, time:'3 days ago', text:'Basically a coworking space with good coffee. Phone booths are bookable and the external monitors are a huge plus.', tags:['Bookable phone booths','External monitors','Fastest Wi-Fi nearby'] },
      { name:'Daniel R.', stars:4, time:'2 weeks ago', text:'The day pass costs more than a coffee, but if you are staying all day it pays for itself.', tags:['All-day access','Ergonomic seating'] } ] },
  { id:'ledger', name:'Ledger Library Café', distance:'1.1 km away', kind:'Library café', workabilityScore:9.1, mbps:180, outletPct:60, db:38, noiseWord:'Silent Zone', spendRule:'No Minimum · Stay Till Close', spendShort:'No minimum', spendHours:6, minSpend:0, lastUpdated:'Updated 1 hr ago', status:'Open now · Silent floor', tags:['Silent floor','Long tables'], x:20, y:30,
    photo:'1507842217343-583bb7270b66', reviews:[
      { name:'Hana M.', stars:5, time:'5 days ago', text:'The silent floor really is silent — perfect for deep work. Not a place for calls, though.', tags:['Deep-work friendly','No calls upstairs'] },
      { name:'Leo P.', stars:4, time:'3 weeks ago', text:'Outlets are only at the long tables, so arrive early to grab one.', tags:['Limited outlets','Arrive early'] } ] },
  { id:'paper', name:'Paper & Pour', distance:'0.7 km away', kind:'Café', workabilityScore:8.7, mbps:95, outletPct:70, db:48, noiseWord:'Calm', spendRule:'₹180 Spend = 2 Hrs Worry-Free Work', spendShort:'₹180 = 2 hrs', spendHours:2, minSpend:180, lastUpdated:'Updated 25 mins ago', status:'Open now · Filling up', tags:['Bar seating','Window counter'], x:58, y:70,
    photo:'1501339847302-ac426a4a7cbb', reviews:[
      { name:'Sofia L.', stars:4, time:'1 day ago', text:'The window counter has an outlet every two seats. Wi-Fi dips a little at lunch.', tags:['Outlets at window counter','Wi-Fi dips at lunch'] },
      { name:'Ravi N.', stars:5, time:'1 week ago', text:'Calm music, friendly baristas, and they really do not mind laptops.', tags:['Laptop-friendly staff','Calm ambiance'] } ] },
  { id:'north', name:'Northside Roasters', distance:'1.4 km away', kind:'Roastery', workabilityScore:7.6, mbps:140, outletPct:40, db:62, noiseWord:'Lively', spendRule:'₹150 Spend = 1 Hr · Laptop-Free Weekends', spendShort:'₹150 = 1 hr', spendHours:1, minSpend:150, lastUpdated:'Updated 3 hrs ago', status:'Open now · Busy', tags:['Communal table','Patio'], x:30, y:80,
    photo:'1445116572660-236099ec97a0', reviews:[
      { name:'Chloe B.', stars:3, time:'4 days ago', text:'Great coffee, but loud. Fine for emails, not for calls.', tags:['Too loud for calls','Good for quick tasks'] },
      { name:'Omar F.', stars:3, time:'2 weeks ago', text:'Laptops are not allowed on weekends — check before you go.', tags:['Weekend laptop ban','Few outlets'] } ] },
  { id:'bean', name:'Bean Theory', distance:'2.3 km away', kind:'Bistro café', workabilityScore:6.8, mbps:45, outletPct:30, db:68, noiseWord:'Busy at Lunch', spendRule:'₹520 Meal = 3 Hrs', spendShort:'₹520 meal = 3 hrs', spendHours:3, minSpend:520, lastUpdated:'Updated 6 hrs ago', status:'Open now · Lunch rush', tags:['Big tables','Late hours'], x:86, y:74,
    photo:'1521017432531-fbd92d768814', reviews:[
      { name:'Grace W.', stars:3, time:'6 days ago', text:'The lunch rush is chaos, but after 3 PM it is surprisingly workable.', tags:['Workable after 3 PM','Noisy at lunch'] },
      { name:'Ethan J.', stars:2, time:'1 month ago', text:'Only a handful of outlets, and the Wi-Fi struggled with a video call.', tags:['Few outlets','Slow Wi-Fi for calls'] } ] },
].map((v, vi) => {
  v.gallery = galleryFor(vi);
  const x = EXTRAS[v.id];
  Object.assign(v, { daylight:x.daylight, pets:x.pets, closes:x.closes });
  v.tags = [...v.tags, ...x.addTags.filter(t => !v.tags.includes(t))];
  if (x.closes >= 22 && !v.tags.some(t => /late/i.test(t))) v.tags.push('Open late');
  syncStrings(v);
  v.image = UNSPLASH(v.photo, 600);
  v.heroImage = UNSPLASH(v.photo, 1600);
  v.reviews = v.reviews.map((r, i) => ({ ...r, id: `${v.id}-${i}`, helpful: 2 + ((i * 7 + v.name.length) % 9), notHelpful: (i * 3 + v.name.length) % 3 }));
  return v;
});

function syncStrings(v) {
  v.wifiSpeed = `⚡ ${v.mbps} Mbps`;
  v.outletDensity = `🔌 ${v.outletPct}% Outlets Open`;
  v.noiseLevel = `🎧 ${v.db} dB · ${v.noiseWord}`;
  return v;
}


const FILTERS = [
  { id:'all', label:'All Spots', sort:'Sorted by workability' },
  { id:'wifi', label:'Fastest Wi-Fi (>100 Mbps)', icon:'zap', sort:'Fastest first' },
  { id:'outlets', label:'High Socket Density', icon:'plug', sort:'Most outlets first' },
  { id:'quiet', label:'Silent / Call Friendly', icon:'headphones', sort:'Quietest first' },
  { id:'spend', label:'Low Minimum Order (<₹200)', icon:'coffee', sort:'Lowest spend first' },
  { id:'daylight', label:'Natural Daylight', icon:'sun', sort:'Sorted by workability' },
  { id:'pets', label:'Pet Friendly', icon:'paw-print', sort:'Sorted by workability' },
  { id:'late', label:'Open Late', icon:'moon', sort:'Latest closing first' },
];

const fmtHour = (h) => h >= 24 ? 'midnight' : `${((h + 11) % 12) + 1} ${h >= 12 ? 'PM' : 'AM'}`;

const TAG_ICONS = [
  [/wall desk|outlet|socket/i, 'plug'], [/natural light|daylight|window/i, 'sun'], [/book/i, 'calendar-check'],
  [/coffee|roast/i, 'coffee'], [/phone booth|call/i, 'phone'], [/monitor/i, 'monitor'], [/ergonomic|chair/i, 'armchair'],
  [/silent|quiet/i, 'volume-x'], [/table|bar seating|counter/i, 'layout-grid'], [/patio|garden/i, 'trees'],
  [/pet/i, 'paw-print'], [/late|night/i, 'moon'],
];
const tagIcon = (t) => (TAG_ICONS.find(([re]) => re.test(t)) || [, 'sparkles'])[1];
const PARSED_TAGS = ['Quiet Noise (42dB)', 'Power Outlets Available at Wall Desks', 'Fast 120 Mbps Wi-Fi'];
const TRANSCRIPT = 'Super quiet in here, the wall desks all have outlets, and the Wi-Fi’s pulling about 120 down.';
const AVATAR_COLORS = ['bg-violet-100 text-violet-800','bg-indigo-100 text-indigo-800','bg-sky-100 text-sky-800','bg-amber-100 text-amber-800','bg-emerald-100 text-emerald-800','bg-rose-100 text-rose-800'];

/* =========================================================
   STATE
   ========================================================= */
const state = {
  venues: VENUES, query:'', filter:'all', tab:'search', selectedId:'foundry',
  favs:new Set(), helpful:new Set(), unhelpful:new Set(), checkins:0,
  view:'desktop', sheetOpen:false, sheetAnim:false,
  modalOpen:false, modalAnim:false, stage:'idle', secs:5, timers:[],
  lightbox:null, lbDir:0, zoom:1,
  profileOpen:false, historyOpen:false, history:[],
  reviewOpen:false, callOpen:false, draft:{ stars:0, text:'', tags:new Set(), photos:[], error:'' },
};
let lastDetailId = null, lastSheetId = null, lastLayout = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON_ATTRS = { 'stroke-width': 2 };
const icons = () => window.lucide && lucide.createIcons({ attrs: ICON_ATTRS });
const selected = () => state.venues.find(v => v.id === state.selectedId) || state.venues[0];
const clamp = (n) => Math.max(0, Math.min(10, n));
const r1 = (n) => Math.round(n * 10) / 10;
const subs = (v) => ({ wifi:r1(clamp(v.mbps/15)), outlet:r1(clamp(v.outletPct/10)), noise:r1(clamp((72-v.db)/3.4)), spend:r1(clamp(v.spendHours/0.6)) });
const smallScreen = () => window.innerWidth < 768;
const layout = () => (state.view === 'mobile' || smallScreen()) ? 'mobile' : 'desktop';
const framed = () => state.view === 'mobile' && !smallScreen();
const walkMins = (v) => Math.max(2, Math.round(parseFloat(v.distance) * 20));
const initials = (n) => n.split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
const avgStars = (v) => v.reviews.length ? r1(v.reviews.reduce((a, r) => a + r.stars, 0) / v.reviews.length) : 0;

function filtered() {
  const q = state.query.trim().toLowerCase();
  let list = state.venues.filter(v => !q || v.name.toLowerCase().includes(q));
  if (state.tab === 'favs') list = list.filter(v => state.favs.has(v.id));
  switch (state.filter) {
    case 'wifi': return list.filter(v => v.mbps > 100).sort((a,b) => b.mbps - a.mbps);
    case 'outlets': return list.filter(v => v.outletPct >= 70).sort((a,b) => b.outletPct - a.outletPct);
    case 'quiet': return list.filter(v => v.db <= 48).sort((a,b) => a.db - b.db);
    case 'spend': return list.filter(v => v.minSpend < 200).sort((a,b) => a.minSpend - b.minSpend);
    case 'daylight': return list.filter(v => v.daylight).sort((a,b) => b.workabilityScore - a.workabilityScore);
    case 'pets': return list.filter(v => v.pets).sort((a,b) => b.workabilityScore - a.workabilityScore);
    case 'late': return list.filter(v => v.closes >= 22).sort((a,b) => b.closes - a.closes);
    default: return list.slice().sort((a,b) => b.workabilityScore - a.workabilityScore);
  }
}

/* =========================================================
   SHELLS
   ========================================================= */
function brandHTML(size = 'md') {
  return `<a href="#" class="flex items-center gap-2.5 shrink-0">
    <span class="${size === 'sm' ? 'w-8 h-8 rounded-[10px]' : 'w-9 h-9 rounded-xl'} brand-grad text-white flex items-center justify-center"><i data-lucide="map-pin" class="w-5 h-5"></i></span>
    <span class="${size === 'sm' ? 'text-[17px]' : 'text-[19px]'} font-extrabold tracking-tight">FindMyDesk</span>
  </a>`;
}

function viewToggleHTML() {
  const d = state.view === 'desktop';
  const btn = (id, label, on) => `<button data-action="view" data-view="${id}" aria-pressed="${on}" class="h-9 px-3.5 rounded-[10px] text-[13px] font-semibold whitespace-nowrap inline-flex items-center gap-1.5 transition ${on ? 'bg-white text-violet-700 shadow-sm' : 'text-slate2 hover:text-ink'}">${label}</button>`;
  return `<div role="group" aria-label="Preview mode" class="inline-flex items-center gap-1 p-1 rounded-xl bg-slate-100 border border-slate-200">
    ${btn('desktop', '<i data-lucide="monitor" class="w-4 h-4"></i>Desktop View', d)}${btn('mobile', '<i data-lucide="smartphone" class="w-4 h-4"></i>Mobile View', !d)}
  </div>`;
}

function searchHTML(placeholder) {
  return `<label class="flex flex-1 items-center gap-2.5 h-11 px-4 rounded-2xl bg-[#F8FAFC] border border-slate-200 text-slate-500 focus-within:border-violet-400 transition">
    <i data-lucide="search" class="w-5 h-5 shrink-0"></i>
    <span class="sr-only">Search venues by name</span>
    <input id="searchInput" type="search" placeholder="${placeholder}" value="${esc(state.query)}" class="flex-1 min-w-0 bg-transparent outline-none text-[15px] text-ink placeholder:text-slate-400">
  </label>`;
}

function desktopShell() {
  return `
  <div class="relative h-screen overflow-hidden bg-[radial-gradient(ellipse_at_top_left,#F3EEFF_0%,#F8FAFC_45%)]">
    <div class="absolute inset-x-0 top-0 z-40 px-6 pointer-events-none">
      <header id="topnav" class="pointer-events-auto sticky top-4 mt-4 z-40 mx-auto max-w-7xl backdrop-blur-xl bg-white/80 border border-slate-200/80 shadow-md rounded-2xl transition-all duration-300 px-4 py-2.5">
        <div class="flex items-center gap-4">
          ${brandHTML()}
          ${searchHTML('Search cafés, libraries, lounges…')}
          ${viewToggleHTML()}
          ${profileButtonHTML()}
        </div>
        <div id="pills" role="group" aria-label="Quick filters" class="mt-2.5 flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 pb-0.5"></div>
      </header>
    </div>
    <div class="h-full w-full max-w-7xl mx-auto flex px-6">
      <aside data-under-nav aria-label="Venues" class="w-[380px] xl:w-[420px] shrink-0 overflow-y-auto overscroll-contain thin-scroll pr-4 pb-6">
        <div class="flex items-baseline justify-between mb-3.5">
          <h2 id="countLabel" class="text-[15px] font-bold"></h2>
          <span id="sortLabel" class="text-xs text-slate-500 font-medium"></span>
        </div>
        <div id="list" class="flex flex-col gap-4 pb-6"></div>
      </aside>
      <section id="detail" data-under-nav aria-label="Venue details" class="flex-1 min-w-0 overflow-y-auto overscroll-contain thin-scroll pl-6 pr-4 pb-32 border-l border-slate-200/70"></section>
    </div>
    <button data-action="open-modal" class="fixed right-8 bottom-8 z-30 h-14 pl-4 pr-6 rounded-full brand-grad text-white font-bold text-[15px] inline-flex items-center gap-2.5 shadow-[0_12px_28px_-10px_rgba(91,33,182,.6)] hover:-translate-y-0.5 transition">
      <span class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i data-lucide="mic" class="w-5 h-5"></i></span>
      5-Sec Voice Check-In
    </button>
    <div id="overlayRoot"></div>
  </div>`;
}

function mobileShell() {
  const f = framed();
  const tab = (id, icon, label) => `<button data-action="tab" data-tab="${id}" class="tabbtn w-16 h-12 flex flex-col items-center justify-center gap-1 text-[11px] font-semibold"><i data-lucide="${icon}" class="w-6 h-6"></i>${label}</button>`;
  const phone = `
    <div class="relative w-full h-full ${f ? 'rounded-[46px]' : ''} overflow-hidden bg-[#F8FAFC] flex flex-col">
      ${f ? '<div aria-hidden="true" class="absolute top-3 left-1/2 -translate-x-1/2 w-[118px] h-[34px] rounded-full bg-black z-[60]"></div>' : ''}
      <header id="topnav" class="absolute ${f ? 'top-[54px]' : 'top-3'} inset-x-3 z-20 backdrop-blur-xl bg-white/80 border border-slate-200/80 shadow-md rounded-2xl transition-all duration-300 px-3.5 py-2.5 flex flex-col gap-2.5">
        <div class="flex items-center justify-between">
          ${brandHTML('sm')}
          <div class="flex items-center gap-3">
            <span class="inline-flex items-center gap-1.5 text-[12.5px] text-slate2 font-semibold"><i data-lucide="navigation" class="w-4 h-4"></i>Near you</span>
            ${profileButtonHTML(true)}
          </div>
        </div>
        ${searchHTML('Search spots by name')}
        <div id="pills" role="group" aria-label="Quick filters" class="flex gap-2 overflow-x-auto no-scrollbar -mx-3.5 px-3.5"></div>
      </header>
      <div id="feed" data-under-nav class="flex-1 overflow-y-auto overscroll-contain no-scrollbar px-4 pb-32">
        <div class="flex items-baseline justify-between mb-3">
          <h2 id="countLabel" class="text-[15px] font-bold"></h2>
          <span id="sortLabel" class="text-xs text-slate-500 font-medium"></span>
        </div>
        <div id="list" class="flex flex-col gap-3.5"></div>
      </div>
      <nav aria-label="Primary" class="absolute inset-x-0 bottom-0 z-30 bg-white/95 backdrop-blur border-t border-slate-100 flex items-start justify-around px-2 pt-2 ${f ? 'pb-7' : 'pb-[max(env(safe-area-inset-bottom),10px)]'}">
        ${tab('search', 'search', 'Search')}
        ${tab('favs', 'heart', 'Favorites')}

/* Content scrolls underneath the floating glass nav: pad each scroll pane by the nav's real height */
function padUnderNav() {
  const nav = $('#topnav'); if (!nav) return;
  const pad = nav.offsetTop + nav.offsetHeight + (layout() === 'desktop' ? 24 : 14);
  document.querySelectorAll('[data-under-nav]').forEach(el => { el.style.paddingTop = pad + 'px'; });
  const sc = document.querySelectorAll('[data-under-nav]');
  sc.forEach(el => el.onscroll = () => nav.classList.toggle('shadow-xl', [...sc].some(s => s.scrollTop > 8)));
}

function scalePhone() {
  const p = $('#phone');
  if (!p) return;
  const s = Math.min(1, (window.innerHeight - 110) / 868);
  p.style.transform = `scale(${s})`;
  p.style.marginBottom = `${-868 * (1 - s)}px`;
}

function renderShell() {
  clearTimersIfIdle();
  const l = layout();
  $('#app').innerHTML = l === 'desktop' ? desktopShell() : mobileShell();
  document.body.classList.toggle('overflow-hidden', l === 'desktop');
  lastLayout = l; lastDetailId = null; lastSheetId = null;
  if (l === 'desktop') state.sheetOpen = false;
  scalePhone();
  renderPills(); renderList(); renderDetail(); renderTabs(); renderOverlays(); renderProfileMenu(); renderLightbox();
  padUnderNav();
  requestAnimationFrame(padUnderNav);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(padUnderNav);
}

function renderDetail() {
  if (layout() === 'desktop') {
    const el = $('#detail'); if (!el) return;
    const v = selected();
    const keep = lastDetailId === v.id ? el.scrollTop : 0;
    el.innerHTML = detailHTML(v, false);
    el.scrollTop = keep;
    lastDetailId = v.id;
    icons();
  } else renderSheet();
}

function renderSheet() {
  const root = $('#sheetRoot'); if (!root) return;
  if (!state.sheetOpen) { root.innerHTML = ''; lastSheetId = null; return; }
  const old = root.querySelector('[data-sheet-scroll]');
  const keep = old && lastSheetId === state.selectedId ? old.scrollTop : 0;
  const pos = framed() ? 'absolute' : 'fixed';
  root.innerHTML = `
    <div class="${pos} inset-0 z-40 ${state.sheetAnim ? 'fade' : ''}">
      <div data-action="close-sheet" class="absolute inset-0 bg-slate-900/45"></div>
      <div role="dialog" aria-modal="true" aria-label="${esc(selected().name)} details" data-sheet-scroll class="${state.sheetAnim ? 'rise' : ''} absolute inset-x-0 bottom-0 top-10 overflow-y-auto overscroll-contain no-scrollbar bg-[#F8FAFC] rounded-t-[28px] px-4 pt-2.5 pb-28">
        <div class="sticky top-0 z-10 -mx-4 px-4 pt-0.5 pb-2 bg-[#F8FAFC] flex items-center justify-between">
          <span class="w-10"></span><span class="w-10 h-1 rounded bg-slate-300"></span>
          <button data-action="close-sheet" aria-label="Close details" class="w-10 h-10 rounded-full bg-white border border-slate-200 text-slate2 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        ${detailHTML(selected(), true)}
      </div>
    </div>`;
  state.sheetAnim = false;
  const nw = root.querySelector('[data-sheet-scroll]'); nw.scrollTop = keep;
  lastSheetId = state.selectedId;
  icons();
}

function renderTabs() {
  document.querySelectorAll('.tabbtn').forEach(b => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle('text-violet-700', on);
    b.classList.toggle('text-slate-500', !on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
}

const BAR_H = [10,18,28,20,36,44,30,22,40,52,34,26,46,38,24,48,54,32,42,28,50,36,20,44,30,40,26,34,18,28,14,10];

function waveHTML(recording) {
  const bars = BAR_H.map((h, i) => `<span class="${recording ? 'wv' : ''} w-1 rounded" style="height:${recording ? h : Math.max(6, Math.round(h * .35))}px;background:${recording ? (i % 3 === 0 ? '#4F46E5' : '#7C3AED') : '#C4B5FD'};animation-delay:${((i % 8) * .09).toFixed(2)}s"></span>`).join('');
  return `
  <div class="rounded-[18px] bg-[#F8FAFC] border border-violet-100 px-4 py-6 flex flex-col items-center gap-4">
    <div class="${recording ? 'recring' : ''} w-16 h-16 rounded-full brand-grad text-white flex items-center justify-center"><i data-lucide="mic" class="w-6 h-6"></i></div>
    <div aria-hidden="true" class="h-14 flex items-center gap-1">${bars}</div>
    <p class="text-sm font-semibold text-slate2 text-center">${recording ? `Listening… 0:0${state.secs} left` : 'Say what you notice: Wi-Fi, outlets, noise, spend rules.'}</p>
  </div>`;
}

function modalHTML() {
  const st = state.stage, v = selected();
  const mobile = layout() === 'mobile';

  if (st === 'idle' || st === 'recording') {
    body = waveHTML(st === 'recording');
    actions = st === 'idle'
      ? `<button data-action="start" class="flex-1 py-3.5 rounded-2xl brand-grad text-white font-bold text-[15px] inline-flex items-center justify-center gap-2.5 hover:shadow-lg transition"><i data-lucide="mic" class="w-5 h-5"></i>Simulate 5-Sec Voice Check-In</button>`

  } else if (st === 'processing') {

function submitReview() {
  const d = state.draft;
  const ta = document.getElementById('reviewText'); if (ta) d.text = ta.value;
  if (!d.stars) { d.error = 'Please pick a star rating first.'; renderOverlays(); return; }
  if (d.text.trim().length < 3 && !d.tags.size) { d.error = 'Add a few words or at least one tag.'; renderOverlays(); return; }
  const id = state.selectedId, tags = [...d.tags];
  state.venues = state.venues.map(v => {
    const reviews = v.reviews.map(r => ({ ...r, fresh:false }));
    if (v.id !== id) return { ...v, reviews, fresh:false };
    const n = { ...v };
    if (d.tags.has('Fast Wi-Fi')) n.mbps = Math.max(n.mbps, 110);
    if (d.tags.has('Slow Wi-Fi')) n.mbps = Math.min(n.mbps, 40);
    if (d.tags.has('Quiet Booths')) { n.db = Math.min(n.db, 44); n.noiseWord = 'Quiet / Call-Friendly'; }
    if (d.tags.has('Too Noisy')) { n.db = Math.max(n.db, 64); n.noiseWord = 'Lively'; }
    if (d.tags.has('Plugs Available')) n.outletPct = Math.min(100, Math.max(n.outletPct, 80));
    if (d.tags.has('Few Outlets')) n.outletPct = Math.min(n.outletPct, 35);
    syncStrings(n);
    const s = subs(n);
    const computed = s.wifi * .3 + s.outlet * .3 + s.noise * .25 + s.spend * .15;
    n.workabilityScore = r1(Math.max(1, Math.min(9.9, (v.workabilityScore * 2 + computed) / 3 + (d.stars - 3) * 0.1)));
    n.lastUpdated = 'Updated just now by Community';
    n.fresh = true;
    n.reviews = [{ id:`rv-${Date.now()}`, name:USER.name, stars:d.stars, time:'Just now', text:d.text.trim() || 'Tagged this workspace.', tags: tags.length ? tags : ['Written review'], photos: d.photos.slice(), written:true, fresh:true, helpful:0, notHelpful:0 }, ...reviews];
    return n;
  });
  state.reviewOpen = false;
  renderOverlays(); renderList(); renderDetail();
  toast('Review posted — scorecard updated', 'check-circle-2');
}

function renderOverlays() {
  const root = $('#overlayRoot'); if (!root) return;
  root.innerHTML = (state.modalOpen ? modalHTML() : '') + (state.historyOpen ? historyHTML() : '') + (state.reviewOpen ? reviewModalHTML() : '') + (state.callOpen ? callModalHTML() : '');
  icons();
}

/* =========================================================
   VOICE CHECK-IN FLOW
   ========================================================= */
function clearTimers() { state.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); state.timers = []; }
function openModal() { clearTimers(); Object.assign(state, { modalOpen:true, modalAnim:true, stage:'idle', secs:5 }); renderOverlays(); }
function closeModal() { clearTimers(); state.modalOpen = false; state.stage = 'idle'; renderOverlays(); }
function startRecording() {
  clearTimers();
  state.stage = 'recording'; state.secs = 5; renderOverlays();
  state.timers.push(setInterval(() => {
    state.secs -= 1;
    if (state.secs <= 0) { clearTimers(); processVoice(); } else renderOverlays();
  }, 1000));
}
function processVoice() {
  state.stage = 'processing'; renderOverlays();
  state.timers.push(setTimeout(applyCheckIn, 1500));
}
function applyCheckIn() {
  const id = state.selectedId;
  state.venues = state.venues.map(v => {
    const reviews = v.reviews.map(r => ({ ...r, fresh:false }));
    if (v.id !== id) return { ...v, reviews, fresh:false };
    const n = { ...v, mbps:120, outletPct:Math.max(85, v.outletPct), db:42, noiseWord:'Quiet / Call-Friendly' };
    syncStrings(n);
    const s = subs(n);
    const computed = r1(s.wifi * .3 + s.outlet * .3 + s.noise * .25 + s.spend * .15);
    n.workabilityScore = r1(Math.min(9.9, Math.max(v.workabilityScore + .1, computed)));
    n.lastUpdated = 'Updated just now by Community';
    n.fresh = true;
    n.tags = ['Wall desks', ...v.tags.filter(t => t !== 'Wall desks')].slice(0, 4);
    n.reviews = [{ id:`ci-${Date.now()}`, name:'You (Community)', stars:5, time:'Just now', text:TRANSCRIPT, tags:PARSED_TAGS, checkin:true, fresh:true, helpful:0 }, ...reviews];
    return n;
  });
  state.checkins += 1;
  state.history.unshift({ id, name: selected().name, time: new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }), tags: PARSED_TAGS });
  state.stage = 'done';
  renderOverlays(); renderList(); renderDetail();
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('change', (e) => {
  if (e.target.id !== 'reviewPhotos') return;
  const ta = document.getElementById('reviewText'); if (ta) state.draft.text = ta.value;
  const files = [...e.target.files].filter(f => f.type.startsWith('image/')).slice(0, MAX_PHOTOS - state.draft.photos.length);
  files.forEach(f => state.draft.photos.push(URL.createObjectURL(f)));
  if (files.length) renderOverlays();
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'reviewText') { state.draft.text = e.target.value; return; }
  if (e.target.id !== 'searchInput') return;
  state.query = e.target.value;
  renderList();
});

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (state.profileOpen && !e.target.closest('[data-profile-wrap]')) { state.profileOpen = false; renderProfileMenu(); }
  if (!t) { const a = e.target.closest('a[href="#"]'); if (a) e.preventDefault(); return; }
  const mobile = layout() === 'mobile';
  const closeMenu = () => { state.profileOpen = false; renderProfileMenu(); };
  switch (t.dataset.action) {
    case 'view':
      if (state.view !== t.dataset.view) { state.view = t.dataset.view; state.lightbox = null; state.profileOpen = false; renderShell(); }
      break;
    case 'profile-menu':
      state.profileOpen = !state.profileOpen; renderProfileMenu();
      break;
    case 'menu-saved':
      closeMenu(); state.tab = 'favs'; state.sheetOpen = false; renderSheet(); renderTabs(); renderList();
      if (!mobile && !state.favs.size) toast('No saved cafés yet — tap the heart on a scorecard', 'heart');
      break;
    case 'review-open':
      state.draft = { stars:0, text:'', tags:new Set(), photos:[], error:'' }; state.reviewOpen = true; renderOverlays();
      setTimeout(() => { const ta = document.getElementById('reviewText'); if (ta) ta.focus(); }, 50);
      break;
    case 'review-close': state.reviewOpen = false; renderOverlays(); break;
    case 'review-star': { const ta = document.getElementById('reviewText'); if (ta) state.draft.text = ta.value; state.draft.stars = +t.dataset.n; state.draft.error = ''; renderOverlays(); break; }
    case 'review-tag': { const ta = document.getElementById('reviewText'); if (ta) state.draft.text = ta.value; const g = t.dataset.tag; state.draft.tags.has(g) ? state.draft.tags.delete(g) : state.draft.tags.add(g); state.draft.error = ''; renderOverlays(); break; }
    case 'review-submit': submitReview(); break;
    case 'photo-sample': {
      const ta = document.getElementById('reviewText'); if (ta) state.draft.text = ta.value;
      const pool = GALLERY_POOLS.flat(), used = state.draft.photos.length;
      state.draft.photos.push(UNSPLASH(pool[(Date.now() + used * 5) % pool.length], 400));
      renderOverlays(); break;
    }
    case 'photo-remove': {
      const ta = document.getElementById('reviewText'); if (ta) state.draft.text = ta.value;
      state.draft.photos.splice(+t.dataset.i, 1); renderOverlays(); break;
    }
    case 'call-open': state.callOpen = true; renderOverlays(); break;
    case 'call-close': state.callOpen = false; renderOverlays(); break;
    case 'call-copy': {
      const num = phoneFor(selected());
      (navigator.clipboard ? navigator.clipboard.writeText(num) : Promise.reject()).then(() => toast('Number copied', 'copy'), () => toast(num, 'phone'));
      break;
    }
    case 'gallery-scroll': {
      const c = t.closest('section').querySelector('[data-carousel]');
      if (c) c.scrollBy({ left: +t.dataset.dir * 268, behavior:'smooth' });
      break;
    }
    case 'menu-history':
      closeMenu(); state.historyOpen = true; renderOverlays();
      break;
    case 'close-history':
      state.historyOpen = false; renderOverlays();
      break;
    case 'menu-settings':
      closeMenu(); toast('Settings are coming soon in this prototype', 'settings');
      break;
    case 'menu-signout':
      closeMenu(); toast(`Signed out of ${USER.name} (demo only)`, 'log-out');
      break;
    case 'filter':
      state.filter = t.dataset.filter;
      if (state.tab === 'profile' || state.tab === 'reviews') state.tab = 'search';
      renderPills(); renderList(); renderTabs();
      break;
    case 'venue':
      if (state.historyOpen) { state.historyOpen = false; renderOverlays(); }
      state.selectedId = t.dataset.venue; state.zoom = 1;
      renderList();
      if (mobile) { state.sheetAnim = !state.sheetOpen; state.sheetOpen = true; }
      renderDetail();
      break;
    case 'pin':
      state.selectedId = t.dataset.venue; renderList(); renderDetail();
      break;
    case 'tab':
      state.tab = t.dataset.tab; renderTabs(); renderList();
      { const feed = $('#feed'); if (feed) feed.scrollTop = 0; }
      break;
    case 'fav':
      state.favs.has(state.selectedId) ? state.favs.delete(state.selectedId) : state.favs.add(state.selectedId);
      renderDetail(); if (mobile) renderList();
      break;
    case 'helpful':
    case 'unhelpful': {
      const id = t.dataset.review, [mine, other] = t.dataset.action === 'helpful' ? [state.helpful, state.unhelpful] : [state.unhelpful, state.helpful];
      if (mine.has(id)) mine.delete(id); else { mine.add(id); other.delete(id); }
    }
      renderDetail(); if (mobile && state.tab === 'reviews') renderList();
      break;
    case 'gallery': state.lightbox = +t.dataset.idx; renderLightbox(); break;
    case 'lb-prev': lbStep(-1); break;
    case 'lb-next': lbStep(1); break;
    case 'lb-close': state.lightbox = null; renderLightbox(); break;
    case 'zoom-in': state.zoom = Math.min(2.2, r1(state.zoom + .4)); renderDetail(); break;
    case 'zoom-out': state.zoom = Math.max(1, r1(state.zoom - .4)); renderDetail(); break;
    case 'recenter': state.zoom = 1; renderDetail(); break;
    case 'close-sheet': state.sheetOpen = false; renderSheet(); break;
    case 'open-modal': openModal(); break;
    case 'close-modal': closeModal(); break;
    case 'start': startRecording(); break;
    case 'stop': clearTimers(); processVoice(); break;
    case 'again': clearTimers(); state.stage = 'idle'; renderOverlays(); break;
    case 'view-card':
      closeModal();
      if (mobile) { state.sheetAnim = !state.sheetOpen; state.sheetOpen = true; renderSheet(); }
      else { const d = $('#detail'); if (d) d.scrollTo({ top:0, behavior:'smooth' }); }
      break;
  }
});

document.addEventListener('keydown', (e) => {
  if (state.lightbox !== null) {
    if (e.key === 'Escape') { state.lightbox = null; renderLightbox(); }
    if (e.key === 'ArrowRight') lbStep(1);
    if (e.key === 'ArrowLeft') lbStep(-1);
    return;
  }
  if (e.key !== 'Escape') return;
  if (state.profileOpen) { state.profileOpen = false; renderProfileMenu(); }
  else if (state.callOpen) { state.callOpen = false; renderOverlays(); }
  else if (state.reviewOpen) { state.reviewOpen = false; renderOverlays(); }
  else if (state.historyOpen) { state.historyOpen = false; renderOverlays(); }
  else if (state.modalOpen) closeModal();
  else if (state.sheetOpen) { state.sheetOpen = false; renderSheet(); }
});

window.addEventListener('resize', () => {
  if (layout() !== lastLayout || (layout() === 'mobile' && !!$('#phone') !== framed())) renderShell();
  else { scalePhone(); padUnderNav(); }
});

renderShell();
</script>
</body>
</html>
